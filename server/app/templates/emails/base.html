{% load i18n %}
<!doctype html>
<html lang="{% get_current_language as LANGUAGE_CODE %}">
  <head>
    <meta charset="utf-8" />
    <title>{% block subject %}{% endblock %}</title>
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      background-color: #f4f4f4;
      font-family: Arial, Helvetica, sans-serif;
    "
  >
    <table width="100%" cellpadding="0" cellspacing="0" role="presentation">
      <tr>
        <td align="center" style="padding: 24px 12px">
          <!-- Container -->
          <table
            width="600"
            cellpadding="0"
            cellspacing="0"
            role="presentation"
            style="background: #ffffff; border-radius: 6px; overflow: hidden"
          >
            <!-- Header -->
            <tr>
              <td
                style="padding: 20px 24px; background: #2c3e50; color: #ffffff"
              >
                <h1 style="margin: 0; font-size: 20px">
                  {% block header %} {{ site_name }} {% endblock %}
                </h1>
              </td>
            </tr>

            <!-- Body -->
            <tr>
              <td
                style="
                  padding: 24px;
                  color: #333333;
                  font-size: 14px;
                  line-height: 1.5;
                "
              >
                {% block content %}{% endblock %}
              </td>
            </tr>

            <!-- Footer -->
            <tr>
              <td
                style="
                  padding: 16px 24px;
                  background: #f0f0f0;
                  font-size: 12px;
                  color: #777777;
                "
              >
                {% include "emails/footer.html" %}
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
