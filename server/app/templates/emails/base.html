{% load i18n %}
<!doctype html>
<html lang="{% get_current_language as LANGUAGE_CODE %}">
  <head>
    <meta charset="utf-8" />
    <title>{% block subject %}{% endblock %}</title>
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      background-color: #F1F1F1;
      font-family: Arial, Helvetica, sans-serif;
    "
  >
    <table width="100%" cellpadding="0" cellspacing="0" role="presentation" >
      <tr>
        <td align="center" style="margin-top: 16px">
          <table
            width="600"
            cellpadding="0"
            cellspacing="0"
            role="presentation"
            style="background: #ffffff; border-radius: 6px; overflow: hidden"
          >
            <tr>
              <td
                style="padding: 20px 24px; background: #EFA76A; color: #FEFDFC"
              >
                <h1 style="margin: 0; font-size: 20px">
                  {% block header %} {{ site_name }} {% endblock %}
                </h1>
              </td>
            </tr>
            <tr>
              <td
                style="
                  padding: 12px 24px;
                  color: #333333;
                  font-size: 14px;
                  line-height: 1.5;
                "
              >
                {% block content %}{% endblock %}
              </td>
            </tr>

      <tr>
        <td>
          {% block footer %}
            {% include "emails/footer.html" %}
          {% endblock %}
        </td>
          </table>
        </td>
      </tr>
      </tr>
    </table>
  </body>
</html>
